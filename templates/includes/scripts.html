<script>
    document.addEventListener('DOMContentLoaded', function() {
        const sidebarToggle = document.querySelector('.sidebar-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        
        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', function() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            });
        }
        
        if (overlay) {
            overlay.addEventListener('click', function() {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        }
        
        // Cerrar sidebar al hacer clic en un enlace (en móviles)
        const sidebarLinks = document.querySelectorAll('.sidebar a');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', function() {
                if (window.innerWidth < 992) {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                }
            });
        });
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const bell = document.getElementById('notifications-bell');
        const panel = document.getElementById('notifications-panel');
        const listContainer = document.getElementById('notifications-list');
        const unreadCount = document.getElementById('unread-count');
        const markAllBtn = document.getElementById('mark-all-read');
        
        // Alternar visibilidad del panel
        bell.addEventListener('click', function(e) {
            e.stopPropagation();
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if (panel.style.display === 'block') {
                loadNotifications();
            }
        });
        
        // Cerrar panel al hacer clic fuera
        document.addEventListener('click', function(e) {
            if (!panel.contains(e.target) && e.target !== bell) {
                panel.style.display = 'none';
            }
        });
        
        // Cargar notificaciones vía AJAX
        function loadNotifications() {
            // Se usa el token '{{ csrf_token }}' en la URL por ser un include y no tener acceso directo
            fetch("{{ request.scheme }}://{{ request.get_host }}{% url 'unread_notifications' %}")
                .then(response => response.json())
                .then(data => {
                    unreadCount.textContent = data.length;
                    listContainer.innerHTML = '';
                    
                    if (data.length === 0) {
                        listContainer.innerHTML = `<div class="p-3 text-center text-muted">No hay notificaciones nuevas</div>`;
                        return;
                    }
                    
                    data.forEach(notif => {
                        const notifElement = document.createElement('a');
                        notifElement.href = notif.link || '#';
                        notifElement.className = `list-group-item list-group-item-action ${notif.read ? '' : 'list-group-item-primary'}`;
                        notifElement.dataset.id = notif.id;
                        
                        notifElement.innerHTML = `
                            <div class="d-flex w-100 justify-content-between">
                                <p class="mb-1">${notif.message}</p>
                                <button class="btn btn-sm mark-read" data-id="${notif.id}">
                                    <i class="fas fa-check"></i>
                                </button>
                            </div>
                            <small class="text-muted">${notif.created_at}</small>
                        `;
                        
                        listContainer.appendChild(notifElement);
                        
                        // Evento para marcar como leído
                        const markBtn = notifElement.querySelector('.mark-read');
                        markBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            markAsRead(notif.id);
                        });
                    });
                });
        }
        
        // Función para marcar como leído
        function markAsRead(notificationId) {
            // Se usa el token '{{ csrf_token }}' en el cuerpo del POST
            fetch(`/notification/read/${notificationId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Actualizar UI
                    const notificationElement = document.querySelector(`.list-group-item[data-id="${notificationId}"]`);
                    if (notificationElement) {
                        notificationElement.classList.remove('list-group-item-primary');
                    }
                    
                    // Actualizar contador
                    const currentCount = parseInt(unreadCount.textContent);
                    unreadCount.textContent = currentCount - 1;
                }
            });
        }
        
        // Marcar todas como leídas
        markAllBtn.addEventListener('click', function() {
            fetch("{% url 'mark_all_read' %}", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Actualizar UI
                    document.querySelectorAll('.list-group-item-primary').forEach(el => {
                        el.classList.remove('list-group-item-primary');
                    });
                    unreadCount.textContent = '0';
                }
            });
        });
    });
</script>
